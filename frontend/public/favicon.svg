<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" rx="24" fill="#0D0718"/>
  <defs>
    <linearGradient id="scFavPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#C084FC" />
      <stop offset="50%" stopColor="#8B5CF6" />
      <stop offset="100%" stopColor="#6D28D9" />
    </linearGradient>
    <linearGradient id="scFavCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="100%" stopColor="#E879F9" />
    </linearGradient>
  </defs>

  <!-- Outer Shield / Hexagonal Frame -->
  <polygon points="50,10 85,28 85,72 50,90 15,72 15,28" stroke="url(#scFavPurple)" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Circuit Nodes -->
  <circle cx="50" cy="20" r="4" fill="#E879F9"/>
  <circle cx="25" cy="35" r="3" fill="#38BDF8"/>
  <circle cx="75" cy="35" r="3" fill="#E879F9"/>

  <!-- Healthcare Cross Background -->
  <rect x="44" y="28" width="12" height="44" rx="3" fill="url(#scFavPurple)" opacity="0.5"/>
  <rect x="28" y="44" width="44" height="12" rx="3" fill="url(#scFavPurple)" opacity="0.5"/>

  <!-- Central Heart Emblem -->
  <path d="M 50 56 C 50 56 36 46 36 38 C 36 33.5 39.5 30 44 30 C 47 30 49 31.5 50 33.5 C 51 31.5 53 30 56 30 C 60.5 30 64 33.5 64 38 C 64 46 50 56 50 56 Z" fill="url(#scFavCyan)"/>

  <!-- ECG Vital Line -->
  <path d="M 20 50 L 32 50 L 37 40 L 42 60 L 47 34 L 52 64 L 57 48 L 62 50 L 80 50" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
